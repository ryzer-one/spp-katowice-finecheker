[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finechecker"
version = "0.1.0"
description = "Katowice SPP fine checker with MQTT Discovery integration"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "r00_ryzer" }
]
dependencies = [
  "selenium>=4.10",
  "paho-mqtt>=1.6",
  "tomli; python_version < '3.11'",
]

[project.scripts]
finechecker = "finechecker.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

